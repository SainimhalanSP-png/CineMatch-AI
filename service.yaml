apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cinematch-ai-service
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '5'
    spec:
      containers:
      - image: gcr.io/project-051c2796-a8db-43d9-99c/cinematch-ai:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: '1Gi'
            cpu: '1000m'
        env:
          - name: SUPPORT_EMAIL
            value: "suganyasai19@gmail.com"
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: cinematch-gemini-key
                key: latest
          - name: GOOGLE_MAPS_API_KEY
            valueFrom:
              secretKeyRef:
                name: cinematch-maps-key
                key: latest
          - name: RESEND_API_KEY
            valueFrom:
              secretKeyRef:
                name: cinematch-resend-key
                key: latest